<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIB International Bank | Data Request System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 20%, rgba(218, 157, 31, 0.14), transparent 35%),
                linear-gradient(135deg, #080808 0%, #15110b 50%, #080808 100%);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* Background glow */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(218, 157, 31, 0.08);
            filter: blur(120px);
            border-radius: 50%;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        /* Main container */
        .login-container {
            position: relative;
            z-index: 2;

            width: 430px;
            max-width: 90%;

            padding: 45px 40px;

            background: rgba(20, 20, 20, 0.88);
            border: 1px solid rgba(218, 157, 31, 0.25);
            border-radius: 20px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.65),
                0 0 35px rgba(218, 157, 31, 0.08);

            backdrop-filter: blur(15px);
        }

        /* Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 180px;
            max-width: 80%;
            height: auto;
            object-fit: contain;
        }

        /* Title */
        .title {
            text-align: center;
            margin-bottom: 8px;
        }

        .title h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .title h1 span {
            color: #e3a51d;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 35px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #d6d6d6;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            background: #111;
            border: 1px solid #333;
            border-radius: 9px;

            color: white;
            font-size: 14px;

            outline: none;

            transition: 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: #666;
        }

        .input-wrapper input:focus {
            border-color: #dba01d;

            box-shadow:
                0 0 0 3px rgba(219, 160, 29, 0.08),
                0 0 15px rgba(219, 160, 29, 0.08);
        }

        /* Password visibility */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);

            background: none;
            border: none;

            color: #888;
            cursor: pointer;

            font-size: 12px;
        }

        .password-toggle:hover {
            color: #e3a51d;
        }

        /* Remember / forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;

            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #aaa;
        }

        .remember input {
            accent-color: #dba01d;
        }

        .forgot {
            color: #dba01d;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Login button */
        .login-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #b8790d,
                #e5a91d
            );

            color: #111;

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;

            cursor: pointer;

            transition: 0.25s ease;

            box-shadow:
                0 8px 20px rgba(218, 157, 31, 0.18);
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 12px 28px rgba(218, 157, 31, 0.28);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Loading state */
        .login-button.loading {
            opacity: 0.7;
            cursor: wait;
        }

        /* Error message */
        .error-message {
            display: none;

            margin-bottom: 20px;
            padding: 12px 14px;

            border-radius: 8px;

            background: rgba(190, 50, 50, 0.12);
            border: 1px solid rgba(220, 80, 80, 0.3);

            color: #ff8d8d;

            font-size: 13px;
        }

        /* Footer */
        .footer {
            text-align: center;

            margin-top: 30px;
            padding-top: 20px;

            border-top: 1px solid #292929;

            color: #666;
            font-size: 11px;
            line-height: 1.6;
        }

        .footer strong {
            color: #9a9a9a;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 500px) {

            .login-container {
                padding: 35px 25px;
            }

            .title h1 {
                font-size: 21px;
            }

            .logo {
                width: 155px;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <main class="login-container">

        <!-- Bank Logo -->
        <div class="logo-container">
            <img
                src="assets/nib-logo.png"
                alt="NIB International Bank"
                class="logo"
            >
        </div>

        <!-- Title -->
        <div class="title">
            <h1>
                Data Request <span>Management</span>
            </h1>
        </div>

        <p class="subtitle">
            Internal Data Request Management System
        </p>

        <!-- Error message -->
        <div id="errorMessage" class="error-message">
            Invalid username or password.
        </div>

        <!-- Login Form -->
        <form id="loginForm">

            <!-- Username -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>

            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >
                        SHOW
                    </button>

                </div>

            </div>

            <!-- Options -->
            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>

                <a
                    href="#"
                    class="forgot"
                    onclick="return false;"
                >
                    Forgot password?
                </a>

            </div>

            <!-- Login -->
            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                SIGN IN
            </button>

        </form>

        <!-- Footer -->
        <div class="footer">

            <strong>NIB International Bank S.C.</strong>

            <br>

            Internal Data Request Management System

        </div>

    </main>


    <script>

        // ==============================
        // PASSWORD SHOW / HIDE
        // ==============================

        const passwordInput =
            document.getElementById("password");

        const passwordToggle =
            document.getElementById("passwordToggle");

        passwordToggle.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                passwordToggle.textContent = "HIDE";

            } else {

                passwordInput.type = "password";

                passwordToggle.textContent = "SHOW";

            }

        });


        // ==============================
        // LOGIN FORM
        // ==============================

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const errorMessage =
            document.getElementById("errorMessage");


        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;


            if (!username || !password) {

                errorMessage.textContent =
                    "Please enter your username and password.";

                errorMessage.style.display = "block";

                return;
            }


            // Loading state

            loginButton.textContent = "SIGNING IN...";

            loginButton.classList.add("loading");

            loginButton.disabled = true;

            errorMessage.style.display = "none";


            /*
             * BACKEND CONNECTION
             *
             * We will connect this to your
             * FastAPI /login endpoint next.
             */

            try {

                const response = await fetch(
                    "https://request-system-backend.onrender.com/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Invalid username or password."
                    );

                }


                console.log("Login successful:", data);
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("user", JSON.stringify(data.user));


                /*
                 * We will use the role returned by
                 * FastAPI to redirect the user:
                 *
                 * requester -> requester.html
                 * engineer  -> engineer.html
                 * manager   -> manager.html
                 */

                const role = data.user.role.toLowerCase();

                if (role === "requester") {

                window.location.href = "requester.html";

                }

                else if (role === "engineer") {

                window.location.href = "engineer.html";

                }

                else if (role === "manager") {

                window.location.href = "manager.html";

                }

                else {

                throw new Error("Unknown user role.");

            }


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                errorMessage.textContent =
                    error.message ||
                    "Unable to connect to the server.";

                errorMessage.style.display =
                    "block";


            } finally {

                loginButton.textContent =
                    "SIGN IN";

                loginButton.classList.remove(
                    "loading"
                );

                loginButton.disabled =
                    false;

            }

        });

    </script>

</body>
</html>
